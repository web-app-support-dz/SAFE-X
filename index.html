.card:hover{transform:translateY(-4px);border-color:#3d8fff;box-shadow:0 0 34px rgba(30,123,255,.25)}
.stat{text-align:center}.stat i,.stat svg{color:var(--cyan)}.stat p{margin:8px 0 2px;font-size:32px;font-weight:800}.stat span{color:var(--mut);font-size:14px}

.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:38px}.bento .card:nth-child(1){grid-column:span 4}.bento .card:nth-child(n+2){grid-column:span 2}.bento .card:nth-child(2) .ic{color:var(--red)}

.legal{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:38px}
details{border-bottom:1px solid var(--line);max-width:780px}summary{display:flex;justify-content:space-between;gap:16px;cursor:pointer;list-style:none;padding:22px 0;font-weight:700}summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--cyan);font-size:24px}details[open] summary::after{content:"−"}details p{color:var(--mut);line-height:1.7;margin:0 0 22px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:44px}.contact label{display:block;font-weight:600;margin:0 0 8px}.contact .in{margin-bottom:18px}
.ln{display:flex;gap:12px;align-items:center;margin-top:14px;color:#bdd2ea}.ln svg{color:var(--cyan)}
footer{padding:48px 0 30px;border-top:1px solid var(--line)}.fg{display:grid;grid-template-columns:1.2fr 1fr auto;gap:36px}.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#0d2b57;border:1px solid var(--cyan);border-radius:12px;padding:12px 18px;font-size:14px;z-index:40;max-width:90vw;text-align:center;transition:.3s}#toast.on{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(22px);transition:.7s}.rv.in-v{opacity:1;transform:none}
:focus-visible{outline:3px solid #82c7ff;outline-offset:3px}
@media(max-width:1000px){nav.d{display:none}#mt{display:inline-flex}.hero,.contact,.fg{grid-template-columns:1fr}.orb{max-width:340px;margin:auto}.stats,.legal{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}.steps::before{display:none}.bento{grid-template-columns:1fr 1fr}.bento .card:nth-child(n){grid-column:span 1}.bento .card:nth-child(1){grid-column:span 2}.about{flex-direction:column;align-items:flex-start}}

:root{color-scheme:dark}html{background:#030b1b;scroll-padding-top:calc(90px + env(safe-area-inset-top,0px))}
[hidden]{display:none!important}
nav.d{gap:16px}.nl.on{color:#fff;border-color:var(--cyan)}

.row{display:flex;gap:12px;flex-wrap:wrap}.l{display:block;font-weight:600;font-size:13px;margin:0 0 8px}.fld{margin-bottom:16px}
.warn{border:1px solid #ffb84d;color:#ffd48a;border-radius:14px;padding:14px 18px;font-size:14px;background:rgba(255,184,77,.08)}

#modal{position:fixed;inset:0;background:rgba(2,8,20,.8);z-index:50;display:grid;place-items:center;padding:20px}#modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto;background:#0a1a35}
.dir-r{text-align:end}

/* ===== v2: header, lang dropdown, live bg, explore atlas, stats, steps ===== */
.bar{width:min(100% - 36px,1320px)}
nav.d{gap:14px;white-space:nowrap}.nl{white-space:nowrap}
.acts{display:flex;align-items:center;gap:10px;padding-inline-start:16px;margin-inline-start:6px;border-inline-start:1px solid var(--line)}

.lgd{position:relative}

.lgb:hover,.lgd.open .lgb{border-color:var(--cyan)}.lgb svg{width:16px;height:16px;color:var(--cyan)}.lgb .chev{transition:transform .2s}.lgd.open .chev{transform:rotate(180deg)}

/* live background */
main,footer{position:relative;z-index:1}
.alt{background:rgba(6,20,40,.55);backdrop-filter:blur(6px)}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx .o{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.o1{width:46vw;height:46vw;left:-12vw;top:-10vw;background:#1e7bff;opacity:.5;animation:dr1 22s ease-in-out infinite alternate}
.o2{width:36vw;height:36vw;right:-10vw;top:30vh;background:#22d3ff;opacity:.26;animation:dr2 28s ease-in-out infinite alternate}
.o3{width:34vw;height:34vw;left:28vw;bottom:-16vw;background:#46d36b;opacity:.16;animation:dr3 25s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(22vw,16vh) scale(1.2)}}@keyframes dr2{to{transform:translate(-20vw,-18vh) scale(.85)}}@keyframes dr3{to{transform:translate(-18vw,-10vh) scale(1.25)}}
.bgfx .gr{position:absolute;inset:-56px 0 0;background-image:linear-gradient(rgba(34,211,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,255,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 35%,#000,transparent 82%);mask-image:radial-gradient(ellipse 85% 75% at 50% 35%,#000,transparent 82%);animation:gm 12s linear infinite}
@keyframes gm{to{transform:translateY(56px)}}
.bgfx .p{position:absolute;left:var(--x);bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);opacity:0;animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.5}100%{transform:translateY(-112vh);opacity:0}}

/* stats strip */
.stats{gap:0;border:1px solid var(--line);border-radius:26px;background:linear-gradient(135deg,rgba(14,40,78,.55),rgba(5,16,36,.7));backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 20px 60px -30px rgba(30,123,255,.6)}
.sx{position:relative;text-align:center;padding:30px 16px;box-shadow:inset 0 0 0 .5px rgba(47,106,168,.55);transition:.3s}
.sx:hover{background:rgba(30,123,255,.12)}

/* faq */
.fsb{position:relative;max-width:760px;margin-inline:auto}.fsb svg{position:absolute;top:50%;inset-inline-start:20px;transform:translateY(-50%);width:22px;height:22px;color:var(--cyan);pointer-events:none}
.fsb .in{height:62px;font-size:17px;padding-inline-start:56px;border-radius:18px;border-color:#2f6aa8;background:rgba(10,26,53,.85);box-shadow:0 18px 50px -24px var(--blue)}
.fcs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.fc2{display:flex;flex-direction:column;gap:4px;text-align:start;padding:16px;border-radius:18px;border:1px solid var(--line);background:rgba(10,26,53,.7);transition:.25s}
.fc2 .ic{width:38px;height:38px;margin:0 0 6px}.fc2 small{color:var(--mut);font-size:12.5px}.fc2:hover{border-color:var(--cyan);transform:translateY(-3px)}
.fc2.on{border-color:var(--blue);background:linear-gradient(180deg,rgba(30,123,255,.35),rgba(8,25,58,.9));box-shadow:0 12px 30px -16px var(--blue)}.fc2.on .ic{color:#fff;background:var(--blue);border-color:var(--blue)}
@media(max-width:800px){.fcs{grid-template-columns:repeat(2,1fr)}}
#fl2{display:grid;gap:12px}
details.fq{max-width:none;border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:18px;background:rgba(8,22,48,.75);transition:.25s}
details.fq:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line));border-inline-start-color:var(--c)}
details.fq[open]{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,#0a1f45),#08193a);box-shadow:0 16px 40px -26px var(--c)}
.fq summary{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;list-style:none;font-weight:700}.fq summary::-webkit-details-marker{display:none}
.fq summary::after,.fq[open] summary::after{content:none}
.fqt{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:99px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.fq .q{flex:1;font-size:16.5px}.pm{flex:none;position:relative;width:30px;height:30px;border-radius:50%;border:1px solid #2f6aa8;transition:.25s}
.pm::before,.pm::after{content:"";position:absolute;top:50%;left:50%;width:12px;height:2px;background:var(--c);border-radius:2px;transform:translate(-50%,-50%);transition:.25s}.pm::after{transform:translate(-50%,-50%) rotate(90deg)}
.fq[open] .pm{background:var(--c);border-color:var(--c)}.fq[open] .pm::before,.fq[open] .pm::after{background:#04122b}.fq[open] .pm::after{transform:translate(-50%,-50%) rotate(0)}
.fa{padding:0 20px 22px;color:#c3d6ee;line-height:1.75;animation:fa .3s}@keyframes fa{from{opacity:0;transform:translateY(-6px)}}
.fq-e{text-align:center;padding:40px;color:var(--mut)}.fq-e svg{width:34px;height:34px;color:var(--cyan)}
@media(max-width:600px){.fq summary{flex-wrap:wrap}.fq .q{flex-basis:100%;order:3}.pm{margin-inline-start:auto}}

/* ===== Contact + Footer ===== */
.ct{display:grid;grid-template-columns:1fr 1.05fr;gap:34px;align-items:start}
.ct-ch{display:grid;gap:12px;margin-top:22px}
.cc{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:linear-gradient(160deg,rgba(14,40,78,.65),rgba(5,16,36,.9));text-align:start;transition:.25s;width:100%}
.cc .ic{margin:0;flex:none;color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#071733)}.cc b{display:block;margin-bottom:3px}.cc p{margin:0;color:var(--mut);font-size:14px}.cc>div{flex:1}
a.cc{text-decoration:none;color:inherit}a.cc:hover{border-color:var(--c);box-shadow:0 14px 34px -20px var(--c)}button.cc:hover{transform:translateX(4px);border-color:var(--c);box-shadow:0 14px 34px -20px var(--c)}html[dir=rtl] button.cc:hover{transform:translateX(-4px)}.ar-go{color:var(--c);font-size:20px}
.ct-use{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.ct-use>div{padding:20px;border-radius:20px}.ct-use h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 8px}.ct-use svg{width:18px;height:18px}
.uk{border:1px solid rgba(70,211,107,.45);background:rgba(70,211,107,.07)}.uk h3,.uk svg{color:var(--green)}
.un{border:1.5px dashed rgba(255,93,108,.5);background:rgba(255,93,108,.05)}.un h3 svg{color:var(--red)}
.ct-f{padding:30px;border-radius:28px;border:1px solid #2f6aa8;background:linear-gradient(180deg,rgba(10,31,69,.85),rgba(6,20,42,.92));box-shadow:0 30px 70px -44px var(--blue)}
.ct-fh{display:flex;align-items:center;gap:14px;margin-bottom:22px}.ct-fh .ic{margin:0}.ct-fh h3{margin:0}.ct-fh p{margin:2px 0 0;font-size:14px}
.ct-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ct-f .btn svg{width:18px;height:18px}
.ct-n{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 0;font-size:13px;color:var(--mut)}.ct-n svg{width:16px;height:16px;color:var(--cyan)}
@media(max-width:900px){.ct{grid-template-columns:1fr}.ct-use,.ct-2{grid-template-columns:1fr}}
footer{padding:0 0 calc(76px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(3,11,27,.4),rgba(3,11,27,.92))}
.ft-cta{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:-1px;padding:30px 34px;border-radius:0 0 28px 28px;border:1px solid #2f6aa8;border-top:0;background:radial-gradient(ellipse 60% 140% at 0% 0%,rgba(30,123,255,.4),transparent 70%),radial-gradient(ellipse 50% 140% at 100% 100%,rgba(70,211,107,.18),transparent 70%),#08193a}
.ft-cta h3{margin:0 0 4px;font-size:clamp(22px,3vw,30px)}.ft-cta p{margin:0}.ft-b{display:flex;gap:10px;flex-wrap:wrap}
.fg2{display:grid;grid-template-columns:1.3fr 1.2fr 1fr;gap:40px;padding-block:46px 10px}
.fg2 h3{font-size:15px;letter-spacing:.04em;margin:0 0 16px;color:var(--cyan)}
.ft-soc{display:flex;gap:10px;margin-top:20px}.ft-soc span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid #2f6aa8;background:#0b2347;color:var(--cyan)}.ft-soc svg{width:18px;height:18px}
.ft-tri{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}.ft-tri li{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}.ft-tri svg{width:18px;height:18px;color:var(--green)}
.ft-bot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:30px;padding-block:20px 28px;border-top:1px solid var(--line);font-size:14px}.ft-bot p{margin:0}
.ft-top{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid #2f6aa8;background:#0b2347;color:var(--cyan);transition:.25s}.ft-top:hover{background:var(--blue);color:#fff;transform:translateY(-3px)}
@media(max-width:900px){.fg2{grid-template-columns:1fr;gap:30px}.ft-cta{padding:24px}}

const FAQ=[['g',['What is SAFE X?','ما هو SAFE X؟'],['SAFE X is presented here as a sample consumer-information platform for e-commerce in Algeria: profiles, complaints, ratings, legal awareness and partner lawyers.','يُعرض SAFE X هنا كمنصة نموذجية لمعلومات المستهلك في التجارة الإلكترونية بالجزائر: ملفات وشكاوى وتقييمات وتوعية قانونية ومحامون شركاء.']],['g',['Is this a real, working platform?','هل هذه منصة حقيقية وتعمل فعليًا؟'],['No. It is an interactive prototype for review. Accounts, saving, messaging and notifications are simulated.','لا. هذا نموذج تفاعلي للمراجعة. الحسابات والحفظ والمراسلة والإشعارات كلها محاكاة.']],['g',['Are the figures and reviews real?','هل الأرقام والمراجعات حقيقية؟'],['No. All figures, scores, profiles and reviews are fictional placeholders for demonstration.','لا. جميع الأرقام والمؤشرات والملفات والمراجعات عناصر وهمية لأغراض العرض.']],['g',['Which languages are available?','ما اللغات المتاحة؟'],['English by default, with a full Arabic version and right-to-left layout through the language switch.','الإنجليزية افتراضيًا مع نسخة عربية كاملة واتجاه من اليمين لليسار عبر زر اللغة.']],['g',['Can I search for a real merchant here?','هل يمكنني البحث عن تاجر حقيقي هنا؟'],['Not in this demo. Search shows the interface only, using fictional profiles.','لا في هذا النموذج. البحث يعرض الواجهة فقط بملفات خيالية.']],['c',['Can I file a complaint?','هل يمكنني تقديم شكوى؟'],['The complaint form shows how it would work. Nothing is saved or sent, and the reference number is invented.','يوضّح نموذج الشكوى طريقة العمل. لا يُحفظ شيء ولا يُرسل، والرقم المرجعي وهمي.']],['c',['What do the complaint statuses mean?','ماذا تعني حالات الشكوى؟'],['New, In progress, Needs more evidence, Resolved, and Rejected. The How It Works page explains each one.','جديدة، قيد المعالجة، تحتاج إلى دليل إضافي، محسومة، ومرفوضة. توضّح صفحة «كيف يعمل» كل حالة.']],['c',['Who could see my evidence?','من يمكنه رؤية أدلتي؟'],['In the concept, personal data and complaint evidence are never shown in public results.','في هذا المفهوم لا تُعرض البيانات الشخصية ولا أدلة الشكاوى في النتائج العامة.']],['c',['Can merchants reply?','هل يستطيع التجار الرد؟'],['In the concept, merchants and delivery companies can answer complaints and reviews from their own dashboards.','في هذا المفهوم يمكن للتجار وشركات التوصيل الرد على الشكاوى والتقييمات من لوحاتهم.']],['l',['Is legal advice available here?','هل تتوفر استشارة قانونية هنا؟'],['No. Legal-awareness pages and partner-lawyer screens illustrate possible features and are not legal advice or referrals.','لا. صفحات التوعية القانونية وشاشات المحامين توضّح ميزات محتملة وليست استشارة ولا إحالة.']],['l',['How would a lawyer consultation work?','كيف ستعمل استشارة المحامي؟'],['A shopper would pick a lawyer, choose a slot and follow the request status. Here this is simulated only.','يختار المتسوّق محاميًا وموعدًا ثم يتابع حالة الطلب. هنا هي محاكاة فقط.']]];

document.addEventListener('change',e=>{const i=e.target.id;if(i==='sw'){S.w=e.target.value;fillSearch()}if(i==='sr2'){S.r=+e.target.value;fillSearch()}if(i==='ce')ST.ent=+e.target.value});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const k=f.dataset.f;
if(k==='hero'){S.q=$('#hq').value.trim();go('search')}
if(k==='cmp'){ST.ref++;const c=CT[+$('#ct').value],en=ENT[+$('#ce').value];$('#cres').innerHTML=`<div class="res"><b>DEMO-${ST.ref}</b> · ${L(en[0])} · ${L(c)}<div style="display:grid;gap:8px;margin-top:14px;font-size:13px">${STS.map((s,i)=>`<div style="opacity:${i?0.4:1}"><span class="dot" style="background:${s[2]}"></span>${AR?s[1]:s[0]}${i?'':(AR?' ← الحالة الحالية':' ← current status')}</div>`).join('')}</div><p class="mut" style="margin:12px 0 0;font-size:12.5px">${AR?'لم تُحفظ ولم تُرسل — عرض تجريبي فقط.':'Not saved or sent — demo only.'}</p></div>`}
if(k==='ctc'){f.reset();toast('Demo only — your message was not sent or saved.','عرض تجريبي فقط — لم تُرسل الرسالة ولم تُحفظ.')}
if(k==='login'||k==='signup')toast('Accounts and sign-in are not available in this demo.','الحسابات وتسجيل الدخول غير متاحين في هذا النموذج التجريبي.')});
$('#mt').onclick=()=>{const m=$('#mm');m.classList.toggle('open');$('#mt').setAttribute('aria-expanded',m.classList.contains('open'))};
$$('[data-ar]').forEach(e=>e.dataset.en=e.innerHTML);
window.addEventListener('hashchange',nav);nav();

function fx(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);const n=+el.dataset.n;if(rm){el.textContent=n;return}const t0=performance.now(),D=1400,st=tt=>{const k=Math.min(1,(tt-t0)/D);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}),{threshold:.4});$$('[data-n]').forEach(el=>io.observe(el))}
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.at');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')});
document.addEventListener('click',e=>{const b=e.target.closest('.lgb');$$('.lgd').forEach(d=>{const on=!!b&&d===b.parentElement&&!d.classList.contains('open');d.classList.toggle('open',on);d.querySelector('.lgb').setAttribute('aria-expanded',String(on))});if(e.target.closest('[data-l]'))$$('.lgc').forEach(s=>s.textContent=AR?'AR':'EN')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.lgd.open').forEach(d=>d.classList.remove('open'))});

document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;const h=a.getAttribute('href').slice(1);if(!Object.prototype.hasOwnProperty.call(PAGES,h))return;e.preventDefault();go(h)});
window.addEventListener('popstate',()=>nav());

document.addEventListener('change',e=>{const c=e.target.closest&&e.target.closest('.ck input');if(!c)return;const bx=c.closest('.cl'),all=[...bx.querySelectorAll('.ck input')],n=all.filter(x=>x.checked).length;bx.querySelector('.cp b').textContent=n+'/'+all.length;bx.querySelector('.cbar i').style.width=(n/all.length*100)+'%'});

document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-top]'))window.scrollTo({top:0,behavior:'smooth'})});
</script></body></html>
